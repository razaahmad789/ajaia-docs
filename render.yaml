# Render Blueprint: Django API + managed Postgres.
# The FRONTEND is deployed separately on Vercel (see frontend/vercel.json and
# the README "Deploy" section), so this file only defines the backend.
#
# Deploy: push to GitHub -> Render dashboard -> New + -> Blueprint -> pick this
# repo. After the first deploy, set CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS
# to your Vercel URL (the two `sync: false` vars below).

databases:
  - name: ajaia-docs-db
    plan: free
    # Free Postgres expires ~30 days after creation. To make it permanent,
    # create a free Neon/Supabase Postgres and set DATABASE_URL to its URL
    # instead (remove this block and the fromDatabase ref below).

services:
  - type: web
    name: ajaia-docs-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
      - key: SEED_PASSWORD
        value: "password123"
      # Set these to your Vercel frontend URL after its first deploy, e.g.
      #   https://ajaia-docs.vercel.app   (full https://, no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Optional Django admin login for /admin/.
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
